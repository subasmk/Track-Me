name: Apply selected H launcher icon
on:
  push:
    branches: [feature/ai-quest-builder]
    paths: [.github/workflows/apply-icon.yml]
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place verified image and launcher XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          res = Path('android/app/src/main/res')
          src = res / 'drawable-nodpi/2-h_streak_flame_2026.png'
          assert hashlib.sha256(src.read_bytes()).hexdigest() == 'c4757785ae88b945b15ac1a9ffa64ea5d6702a89b873da379abb80ac5cf0e1b3'
          src.rename(res / 'drawable-nodpi/ic_launcher_flame.png')
          xml = {
              'ic_launcher_background.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="#0C1424" />\n</shape>\n''',
              'ic_launcher_foreground.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<bitmap xmlns:android="http://schemas.android.com/apk/res/android"\n    android:src="@drawable/ic_launcher_flame" android:gravity="fill" />\n''',
              'ic_launcher_legacy.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:drawable="@drawable/ic_launcher_background" />\n    <item android:drawable="@drawable/ic_launcher_flame" />\n</layer-list>\n''',
          }
          for name, content in xml.items():
              (res / 'drawable' / name).write_text(content)
          PY
          git config user.name subasmk
          git config user.email subasmk@users.noreply.github.com
          git add android/app/src/main/res
          git commit -m 'Use selected streak flame as launcher icon'
          git push origin HEAD:feature/ai-quest-builder
