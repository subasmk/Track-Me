name: Restore AI service
on:
  push:
    branches: [feature/ai-quest-builder]
    paths: [.github/workflows/restore-ai.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the exact prior file
        run: |
          git config user.name subasmk
          git config user.email subasmk@users.noreply.github.com
          git checkout 7d48c1a7e06b2b9e284d383ba086ada85dc4442d -- lib/services/ai_service.dart
          test "$(git hash-object lib/services/ai_service.dart)" = 56aabc7a109e7a9c39509088059fc9988bc088c9
          git commit -m 'Restore AI service deleted by web editor'
          git push origin HEAD:feature/ai-quest-builder
