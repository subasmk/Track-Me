name: Remove temporary maintenance workflows
on:
  push:
    branches: [feature/ai-quest-builder]
    paths: [.github/workflows/cleanup-ci.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot workflows
        run: |
          git config user.name subasmk
          git config user.email subasmk@users.noreply.github.com
          git rm .github/workflows/restore-ai.yml .github/workflows/fix-ai.yml .github/workflows/apply-icon.yml .github/workflows/cleanup-ci.yml
          git commit -m 'Remove temporary maintenance workflows'
          git push origin HEAD:feature/ai-quest-builder
