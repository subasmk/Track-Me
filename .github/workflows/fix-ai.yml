name: Apply AI model fix
on:
  push:
    branches: [feature/ai-quest-builder]
    paths: [.github/workflows/fix-ai.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact verified edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/ai_service.dart')
          s = p.read_text()
          pairs = [
            ("'gemini-flash-latest', 'gemini-2.5-flash-lite'", "'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite'"),
            ("'gpt-5.6-luna', 'gpt-4o-mini'", "'gpt-4o-mini'"),
            ("model:AI usage limit reached for now. Try again in a minute.", "AI usage limit reached for now. Check your provider quota and try later."),
            ("model:The AI service is busy. Try again.", "The AI service is busy. Try again."),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          test "$(git hash-object lib/services/ai_service.dart)" = 71b269102859e2367d67c749ef4987a6746e8d1e
          git config user.name subasmk
          git config user.email subasmk@users.noreply.github.com
          git add lib/services/ai_service.dart
          git commit -m 'Fix AI provider defaults and quota errors'
          git push origin HEAD:feature/ai-quest-builder
