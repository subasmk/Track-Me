name: Remove final one-shot workflow
on:
  push:
    branches: [feature/ai-quest-builder]
    paths: [.github/workflows/final-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflows
        run: |
          git config user.name subasmk
          git config user.email subasmk@users.noreply.github.com
          git rm .github/workflows/final-ai.yml .github/workflows/final-cleanup.yml
          git commit -m 'Remove final one-shot CI workflows'
          git push origin HEAD:feature/ai-quest-builder
