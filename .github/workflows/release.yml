name: Publish APK release

# Attaches the APKs from a finished "Build TrackMe APK" run to a GitHub
# release, so the release carries the exact build that was tested.
#
# Trigger: push an annotated tag named v* whose message contains
# "run <build run ID>", e.g. "run 35948505201". The release for that tag
# (draft or published) must already exist.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID whose trackme-apks artifact to publish'
        required: true
      tag:
        description: 'Release tag to attach the APKs to (e.g. v1.1)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Work out the tag and build run
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_REF#refs/tags/}"
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha + " " + .object.type')
          set -- $obj
          if [ "$2" != "tag" ]; then echo "Tag $tag is not annotated"; exit 1; fi
          msg=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$1" --jq .message)
          run_id=$(printf '%s\n' "$msg" | grep -oE 'run [0-9]+' | head -1 | cut -d' ' -f2)
          if [ -z "$run_id" ]; then echo "No 'run <id>' in tag message"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download APKs from the build run
        uses: actions/download-artifact@v4
        with:
          name: trackme-apks
          run-id: ${{ steps.meta.outputs.run_id }}
          github-token: ${{ github.token }}
          path: apks

      - name: Attach APKs to the release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ls -la apks
          gh release upload "$TAG" apks/*.apk --clobber --repo "$GITHUB_REPOSITORY"
