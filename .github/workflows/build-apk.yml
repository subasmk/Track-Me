name: Build TrackMe APK

# Runs automatically on every push, and can also be triggered manually from
# the "Actions" tab on GitHub (the workflow_dispatch trigger below) without
# needing to push a new commit each time.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release split APKs
        run: flutter build apk --release --split-per-abi

      # Shows up as a downloadable .zip under the finished run's "Artifacts"
      # section — unzip it to get your optimized <30MB architecture APKs.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: trackme-apks
          path: build/app/outputs/flutter-apk/*.apk
