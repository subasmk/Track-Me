name: trackme
description: "TrackMe - Duolingo-inspired learning consistency tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # IDs
  uuid: ^4.4.0

  # Animations (pure-code, no external asset files required)
  confetti: ^0.7.0
  flutter_animate: ^4.5.0

  # Calendar heatmap
  table_calendar: ^3.1.2

  # Android home widget bridge
  # Pinned to 0.9.2+ (latest as of mid-2026): includes the Android 15
  # launch-from-widget fix and current Android Gradle Plugin compatibility.
  # NOTE: for a 0.x package, "^0.9.2" means ">=0.9.2 <0.10.0" under Dart's
  # caret semantics (not "<1.0.0") — bump the minor version by hand if a
  # newer 0.x release is available when you build this.
  home_widget: ^0.9.2

  # Utility
  intl: ^0.19.0

  # Note attachments: pick a photo from the gallery, get a permanent local
  # path to copy it to, and open an attached link when tapped.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

  # Online backend database & auth
  supabase_flutter: ^2.8.0

  # Backup/export: serialize all data to JSON, hand it to the OS share
  # sheet, and read it back in via a native file picker.
  # NOTE: file_picker recently removed the old `FilePicker.platform.` prefix
  # in favor of static methods (`FilePicker.pickFiles()` directly) — code in
  # this project already uses the new form; older tutorials online still
  # show the removed one.
  share_plus: ^12.0.2
  file_picker: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No bundled image/font assets: the sloth mascot and all iconography are
  # drawn in code (CustomPainter + Material/emoji glyphs) so the app builds
  # and runs with zero missing-asset risk.
