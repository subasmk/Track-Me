org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=false

# AGP 9.0+ reads a different ("new DSL") project format by default. This
# project still uses the classic AGP 8.x style (plugins block in
# settings.gradle, Groovy build.gradle), which Flutter's tooling still
# fully supports as long as these two flags stay false. Pinning them here
# explicitly rather than relying on Flutter's automatic migrator.
android.newDsl=false
android.builtInKotlin=false

# The pub cache lives on C: while this project is on D:. Kotlin's
# incremental compiler cannot relativize paths across different drive
# roots, so disable incremental compilation to avoid those build crashes.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
